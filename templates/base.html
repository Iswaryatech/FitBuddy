<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FitBuddy{% endblock %}</title>
  <meta name="description" content="FitBuddy maps out your week of training, cardio and recovery.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="FitBuddy home">
      <svg viewBox="0 0 40 24" width="40" height="24" aria-hidden="true">
        <path d="M4 18 C12 18 12 6 20 6 S28 18 36 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="4" cy="18" r="3" fill="var(--blue)"/>
        <circle cx="20" cy="6" r="3" fill="var(--sun)"/>
        <circle cx="36" cy="18" r="3" fill="var(--mint)"/>
      </svg>
      <span>FitBuddy</span>
    </a>
    <nav aria-label="Main">
      <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Build a plan</a>
      <a href="/coach" {% if request.url.path.startswith('/coach') %}aria-current="page"{% endif %}>Coach view</a>
    </nav>
  </header>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>FitBuddy gives general wellness guidance, not medical advice. If you have an injury, a health condition, are pregnant, or feel pain while training, check with a qualified professional first.</p>
  </footer>
  <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
</body>
</html>
